<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ECS Memory Simulation</title>
    <style>
        body { background-color: #111827; color: #f3f4f6; font-family: sans-serif; padding: 20px; }
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1000px; margin: auto; }
        .panel { background: #1f2937; padding: 20px; border-radius: 12px; border: 1px solid #374151; }
        .memory-grid { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 15px; background: #000; padding: 10px; border-radius: 8px; }
        .block { width: 14px; height: 14px; border-radius: 2px; }
        .P { background: #60a5fa; } /* Position */
        .V { background: #4ade80; } /* Velocity */
        .other { background: #f87171; opacity: 0.5; } /* HP/Mesh */
        .active { outline: 2px solid white; transform: scale(1.2); }
        button { background: #2563eb; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div style="max-width: 1000px; margin: auto;">
        <h1>ECS vs OOP メモリレイアウト比較</h1>
        <button id="startBtn">シミュレーション開始</button>
        <button id="resetBtn" style="background:#4b5563;">リセット</button>
        
        <div class="grid-container" style="margin-top: 20px;">
            <div class="panel">
                <h2>従来 (OOP / AoS)</h2>
                <div id="oop-memory" class="memory-grid"></div>
            </div>
            <div class="panel">
                <h2>次世代 (ECS / SoA)</h2>
                <div id="ecs-memory" class="memory-grid"></div>
            </div>
        </div>
    </div>

    <script>
        const ENTITY_COUNT = 64;
        const oopMem = document.getElementById('oop-memory');
        const ecsMem = document.getElementById('ecs-memory');

        function init() {
            oopMem.innerHTML = ''; ecsMem.innerHTML = '';
            // OOP: P, V, H, M が並ぶ
            for(let i=0; i<ENTITY_COUNT*4; i++) {
                const d = document.createElement('div');
                d.className = 'block ' + (i%4 < 2 ? (i%4===0 ? 'P' : 'V') : 'other');
                oopMem.appendChild(d);
            }
            // ECS: P配列, V配列
            for(let i=0; i<ENTITY_COUNT*2; i++) {
                const d = document.createElement('div');
                d.className = 'block ' + (i < ENTITY_COUNT ? 'P' : 'V');
                ecsMem.appendChild(d);
            }
        }

        document.getElementById('startBtn').onclick = () => {
            let i = 0;
            const timer = setInterval(() => {
                if(i >= ENTITY_COUNT*4) { clearInterval(timer); return; }
                if(i < oopMem.children.length) oopMem.children[i].classList.add('active');
                if(i < ecsMem.children.length) ecsMem.children[i].classList.add('active');
                i++;
            }, 50);
        };

        document.getElementById('resetBtn').onclick = init;
        init();
    </script>
</body>
</html>
