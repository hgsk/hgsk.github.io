name: "Build and Deploy"

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Fetch Loci update APK
        run: |
          MANIFEST=./dist/Loci/update/version.json
          TARGET=./dist/Loci/update/app-debug.apk
          [ -f "$MANIFEST" ] || exit 0
          mkdir -p "$(dirname "$TARGET")"
          TEMP_APK=$(mktemp)
          if curl --fail --location --retry 3 --retry-delay 2 \
            --output "$TEMP_APK" \
            https://github.com/hgsk/Loci/releases/download/continuous/app-debug.apk; then
            EXPECTED_SHA=$(node -p "JSON.parse(require('fs').readFileSync('$MANIFEST', 'utf8')).sha256")
            echo "${EXPECTED_SHA}  ${TEMP_APK}" | sha256sum --check -
            mv "$TEMP_APK" "$TARGET"
          elif [ ! -s "$TARGET" ]; then
            rm -f "$TEMP_APK"
            echo "Loci update APK is unavailable" >&2
            exit 1
          else
            rm -f "$TEMP_APK"
            echo "::warning::Rolling Loci APK is not available yet; keeping the source copy."
          fi

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
