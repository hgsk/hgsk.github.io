<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ECS Memory Simulation</title>
    <style>
        body { font-family: sans-serif; background: #111827; color: #e5e7eb; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        .box { background: #1f2937; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #374151; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .visualizer { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; min-height: 100px; background: #000; padding: 10px; border-radius: 4px; }
        .block { width: 16px; height: 16px; border: 1px solid #444; }
        .used { background: #3b82f6; } /* 有効なデータ */
        .wasted { background: #ef4444; } /* 無駄なデータ */
        button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; background: #2563eb; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ECS メモリ最適化シミュレーション</h1>
        <div class="box">
            <label>Object数: <input type="range" id="rngNum" min="16" max="256" value="64"></label>
            <button id="startBtn">スタート</button>
            <button id="resetBtn" style="background:#4b5563;">リセット</button>
        </div>

        <div class="grid">
            <div>
                <h3>従来 (AoS: Objectごと)</h3>
                <div id="oopVis" class="visualizer"></div>
                <p>無駄な読込: <span id="oopWaste" style="color:#ef4444;">0</span></p>
            </div>
            <div>
                <h3>次世代 (SoA: データごと)</h3>
                <div id="ecsVis" class="visualizer"></div>
